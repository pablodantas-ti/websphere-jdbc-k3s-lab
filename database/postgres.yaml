apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-lab-data
  namespace: websphere
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-lab-init
  namespace: websphere
data:
  01-lab.sql: |
    \set ON_ERROR_STOP on
    \getenv app_password APP_PASSWORD
    CREATE ROLE waslab LOGIN PASSWORD :'app_password';
    GRANT CONNECT ON DATABASE labdb TO waslab;
    CREATE SCHEMA lab;
    CREATE TABLE lab.produtos (
      id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      nome varchar(100) NOT NULL,
      preco numeric(10,2) NOT NULL CHECK (preco >= 0)
    );
    INSERT INTO lab.produtos(nome, preco) VALUES
      ('Curso WebSphere', 150.00),
      ('Laboratorio JDBC', 80.00),
      ('Guia de Troubleshooting', 65.50);
    GRANT USAGE ON SCHEMA lab TO waslab;
    GRANT SELECT ON lab.produtos TO waslab;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-lab
  namespace: websphere
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-lab
  template:
    metadata:
      labels:
        app: postgres-lab
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: labadmin
            - name: POSTGRES_DB
              value: labdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-lab-auth
                  key: admin-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-lab-auth
                  key: app-password
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U labadmin -d labdb']
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U labadmin -d labdb']
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-lab-data
        - name: init
          configMap:
            name: postgres-lab-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lab
  namespace: websphere
spec:
  type: ClusterIP
  selector:
    app: postgres-lab
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
