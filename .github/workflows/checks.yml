name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project contracts
        run: python3 tools/check_project.py
      - name: Validate Bash syntax
        run: |
          for f in executar.sh scripts/*.sh database/*.sh image/*.sh; do
            bash -n "$f" || exit
          done
